# SearXNG Sovereign Configuration for JKAI Zenith
use_default_settings: true

general:
  debug: false
  instance_name: "JKAI Zenith Sovereign Search"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "vi"
  formats:
    - html
    - json

server:
  # Secret key for session encryption (passed via environment variable SEARXNG_SECRET / SEARXNG_SECRET_KEY)
  secret_key: "${SEARXNG_SECRET_KEY:-}"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: auto
