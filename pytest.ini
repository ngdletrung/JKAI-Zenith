[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = AI_TEAM clean-repo files .git .pytest_cache venv __pycache__ test_agent_autonomy
markers =
    network: requires live local services (Ollama/Qdrant) or external network; deselected by default
    live: requires a real interactive desktop / UIA session; deselected by default
    perf: latency-budget sensitive; run separately with -m perf to avoid load-induced flakes
addopts = -m "not network and not live and not perf"
