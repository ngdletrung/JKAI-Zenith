[build-system]
requires = ["setuptools>=68.0,<80.0", "wheel>=0.40.0,<1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jkai-zenith"
version = "28.4.1"
description = "JKAI Zenith: Hệ điều hành Trí tuệ Chiến lược"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103.0,<1.0.0",
    "uvicorn>=0.23.2,<1.0.0",
    "pydantic>=2.3.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
    "asyncpg>=0.28.0,<1.0.0",
    "qdrant-client>=1.5.4,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.24.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "jsonschema>=4.19.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "markitdown>=0.0.1,<1.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "pytz>=2023.3,<2026.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "intelligence*", "services*", "tools*", "rag*"]
exclude = ["data*", "cache*", "files*", "results*", "storage*", "n8n_data*", "qdrant*", "tests*", "scratch*", "evidence*", "workspace*", "models*", "brain*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "B110",  # except: pass
    "B112",  # except Exception: pass
    "T201",  # print found
    "F401",  # unused imports
    "F841",  # unused variables
    "E402",  # module level import not at top
    "E722",  # bare except
    "W291",  # trailing whitespace
    "W293",  # blank line whitespace
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F403",  # star imports allowed
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"scratch/*" = ["T201", "F401"]
"tests/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type .* has no __qualname__:DeprecationWarning",
]

